<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDEN Finance Dashboard - Charts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">EDEN Finance Dashboard</span>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Transactions</a>
        <a class="nav-link active" href="visualizer.html">Charts</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h1 class="h3 mb-4">Charts</h1>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-3">
          <h2 class="h5">Expenses by category</h2>
          <canvas id="pieChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h2 class="h5">Income vs expenses per month</h2>
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="col-12">
        <div class="card p-3">
          <h2 class="h5">Spending over time</h2>
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
