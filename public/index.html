<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDEN Finance Dashboard</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

 
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">EDEN Finance Dashboard</span>
      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">Transactions</a>
        <a class="nav-link" href="visualizer.html">Charts</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h1 class="h3 mb-4">Transactions</h1>
        <div class="row g-2 mb-3">
      <div class="col-auto">
        <label class="form-label small">From</label>
        <input type="date" id="fromDate" class="form-control">
      </div>
      <div class="col-auto">
        <label class="form-label small">To</label>
        <input type="date" id="toDate" class="form-control">
      </div>
      <div class="col-auto d-flex align-items-end gap-2">
        <button id="applyFilter" class="btn btn-primary">Apply</button>
        <button id="clearFilter" class="btn btn-outline-secondary">Clear</button>
      </div>
    </div>
    <table id="txTable" class="table table-striped table-bordered" style="width:100%">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Product</th>
          <th>Quantity</th>
          <th>Amount (USD)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- jQuery (required by DataTables) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="js/table.js"></script>
</body>
</html>
